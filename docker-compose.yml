services:
  backend:
    build:
      context: ./backend
    container_name: library-ai-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./database:/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: library-ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
